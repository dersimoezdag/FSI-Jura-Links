<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FSI Jura Erlangen | Links</title>
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="theme-toggle-wrap">
        <button class="theme-toggle" type="button" aria-label="Theme umschalten" aria-pressed="false">
          <span class="theme-switch" aria-hidden="true">
            <span class="theme-icon theme-icon--sun">☀️</span>
            <span class="theme-icon theme-icon--moon">🌙</span>
            <span class="theme-knob"></span>
          </span>
          <span class="theme-text">Light</span>
        </button>
      </div>
      <!-- Logo/Avatar Placeholder -->
      <img src="logo.png" alt="FSI Jura Erlangen Logo" class="profile-img" />

      <h1>FSI Jura Erlangen</h1>
      <p>Fachschaftsinitiative Rechtswissenschaften</p>

      <!-- Links -->
      <a href="https://jura.fsi.fau.de" class="link-btn" target="_blank">
        <img src="icons/earth.svg" alt="" class="link-icon" />
        <span>Offizielle Webseite der Fachschaft</span>
      </a>

      <section class="updates-card" aria-labelledby="aktuelles-title">
        <h2 id="aktuelles-title">Aktuelles</h2>

        <div class="event-subcard">
          <p class="event-card__eyebrow">Semester Opening Party</p>
          <p class="event-card__description">Sichere dir jetzt dein Ticket für die Semester Opening Party.</p>

          <a href="https://paisley.ticket.io/hl9FAXuN/fjzba1sb1w/" class="cta-button" target="_blank" rel="noopener noreferrer">
            <svg class="cta-button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 3 2 9l10 6 8.2-4.92V17h1.8V9L12 3Zm-6.43 6L12 5.14 18.43 9 12 12.86 5.57 9ZM6 12.17V16l6 3.6 6-3.6v-3.83L12 15.77 6 12.17Z" fill="currentColor" />
            </svg>
            <span>Jetzt Ticket sichern</span>
          </a>

          <div class="discount-code">
            <label for="discount-code">Rabattcode/Passwort</label>
            <div class="discount-code__controls">
              <input id="discount-code" type="text" value="jura26" readonly aria-label="Rabattcode jura26" />
              <button class="copy-button" type="button" data-copy-target="discount-code" aria-label="Rabattcode kopieren">
                <svg class="copy-button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path
                    d="M8 7V5.75C8 4.78 8.78 4 9.75 4h8.5c.97 0 1.75.78 1.75 1.75v8.5c0 .97-.78 1.75-1.75 1.75H17v-1.75h1.25V5.75H9.75V7H8Zm-2.25 2h8.5c.97 0 1.75.78 1.75 1.75v8.5c0 .97-.78 1.75-1.75 1.75h-8.5A1.75 1.75 0 0 1 4 19.25v-8.5C4 9.78 4.78 9 5.75 9Zm0 1.75v8.5h8.5v-8.5h-8.5Z"
                    fill="currentColor"
                  />
                </svg>
              </button>
            </div>
            <span class="copy-status" role="status" aria-live="polite"></span>
          </div>
        </div>
      </section>

      <a href="https://www.instagram.com/fachschaft.jura.erlangen/" class="link-btn" target="_blank">
        <img src="icons/instagram.svg" alt="" class="link-icon" />
        <span>Instagram (@fachschaft.jura.erlangen)</span>
      </a>

      <a href="mailto:fsi-jura@fau.de" class="link-btn">
        <img src="icons/mail.svg" alt="" class="link-icon" />
        <span>E-Mail schreiben</span>
      </a>

      <div class="footer">&copy; 2026 FSI Jura Erlangen</div>
    </div>
    <script>
      (function () {
        var storageKey = 'fsi-theme';
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var savedTheme = localStorage.getItem(storageKey);
        var theme = savedTheme || (prefersDark ? 'dark' : 'light');
        var toggle = document.querySelector('.theme-toggle');

        function applyTheme(value) {
          if (value === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            toggle.classList.add('is-dark');
            toggle.setAttribute('aria-pressed', 'true');
            toggle.querySelector('.theme-text').textContent = 'Dark';
          } else {
            document.body.removeAttribute('data-theme');
            toggle.classList.remove('is-dark');
            toggle.setAttribute('aria-pressed', 'false');
            toggle.querySelector('.theme-text').textContent = 'Light';
          }
        }

        applyTheme(theme);

        toggle.addEventListener('click', function () {
          var nextTheme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          localStorage.setItem(storageKey, nextTheme);
          applyTheme(nextTheme);
        });
      })();

      (function () {
        var copyButton = document.querySelector('.copy-button');

        copyButton.addEventListener('click', async function () {
          var input = document.getElementById(copyButton.dataset.copyTarget);
          var status = document.querySelector('.copy-status');
          var discountCode = input.value;

          try {
            await navigator.clipboard.writeText(discountCode);
            status.textContent = 'Rabattcode kopiert.';
            input.value = 'Erfolgreich';
            input.setAttribute('aria-label', 'Rabattcode erfolgreich kopiert');
            input.classList.add('is-copied');
            copyButton.classList.add('is-copied');
            copyButton.disabled = true;
            copyButton.setAttribute('aria-label', 'Rabattcode kopiert');
            setTimeout(function () {
              input.value = discountCode;
              input.setAttribute('aria-label', 'Rabattcode ' + discountCode);
              input.classList.remove('is-copied');
              copyButton.classList.remove('is-copied');
              copyButton.disabled = false;
              copyButton.setAttribute('aria-label', 'Rabattcode kopieren');
            }, 1000);
          } catch (error) {
            status.textContent = 'Kopieren war nicht möglich.';
          }
        });
      })();
    </script>
  </body>
</html>
